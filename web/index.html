<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; font-src 'self'; connect-src 'self' blob: data: https://api.github.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>TLK ASCII</title>
  <meta name="description" content="Turn images, videos, webcam footage and text into glowing ASCII art. Looks gallery, edge and halftone modes, dithering, palettes, CRT effects; PNG, GIF, video, SVG and HTML export. Free and private, in your browser or as a Windows app.">
  <meta name="theme-color" content="#18181a">
  <meta property="og:title" content="TLK ASCII">
  <meta property="og:description" content="Image, video and text to glowing ASCII art. Free and private.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://talkdedsec.github.io/tlk-ascii/icons/og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="icons/icon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="#" aria-label="TLK ASCII">
      <img src="icons/icon-64.png" alt="" width="22" height="22">
      <span>TLK ASCII</span>
    </a>
    <button type="button" class="cmd-trigger" id="btn-cmd">
      <span data-i18n="cmdButton"></span>
      <kbd>Ctrl K</kbd>
    </button>
    <span class="spacer"></span>
    <a class="btn quiet web-only" id="download-link" href="#" target="_blank" rel="noopener" data-i18n-title="downloadApp">Windows</a>
    <label class="lang">
      <span class="sr" data-i18n="language"></span>
      <select id="lang">
        <option value="en">EN</option>
        <option value="tr">TR</option>
      </select>
    </label>
    <button type="button" class="btn icon" id="btn-about" data-i18n-title="about">?</button>
    <button type="button" class="btn accent" id="btn-export" data-i18n-title="exportHint"><span data-i18n="export"></span></button>
  </header>

  <main class="workspace">
    <aside class="rail" id="rail" aria-label="Looks"></aside>

    <section class="stage busy" id="stage" aria-label="Preview">
      <div class="toolbar" role="toolbar" aria-label="View">
        <button type="button" class="btn icon quiet" id="btn-rail" aria-pressed="true" data-i18n-title="hideRail">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12v10H2zM6 3v10" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
        <span class="status">
          <span id="status-src" class="src"></span>
          <span id="status-size" class="num muted"></span>
          <span id="status-ms" class="num muted"></span>
        </span>
        <span class="spacer"></span>
        <span class="tool-group">
          <button type="button" class="btn icon quiet" id="btn-undo" data-i18n-title="undo" disabled>↶</button>
          <button type="button" class="btn icon quiet" id="btn-redo" data-i18n-title="redo" disabled>↷</button>
        </span>
        <span class="tool-group">
          <button type="button" class="btn small toggle" id="btn-compare" aria-pressed="false" data-i18n-title="compareHint"><span data-i18n="compare"></span></button>
        </span>
        <span class="tool-group">
          <button type="button" class="btn icon quiet" id="zoom-out" data-i18n-title="zoomOut">−</button>
          <button type="button" class="btn small quiet num" id="zoom-label" data-i18n-title="actual">100%</button>
          <button type="button" class="btn icon quiet" id="zoom-in" data-i18n-title="zoomIn">+</button>
          <button type="button" class="btn icon quiet" id="zoom-fit" data-i18n-title="fit">⤢</button>
        </span>
        <button type="button" class="btn icon quiet" id="btn-focus" data-i18n-title="focus">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
      </div>

      <div class="viewport" id="viewport">
        <div class="frame" id="frame">
          <canvas id="out" width="1" height="1"></canvas>
          <canvas id="before" width="1" height="1" aria-hidden="true"></canvas>
          <div class="divider" aria-hidden="true"><span></span></div>
        </div>
      </div>

      <div class="empty-state">
        <h1 data-i18n="emptyTitle"></h1>
        <p data-i18n="emptyBody"></p>
        <div class="btn-row center">
          <button type="button" class="btn accent" id="btn-open-empty"><span data-i18n="open"></span></button>
          <button type="button" class="btn" id="btn-demos-empty"><span data-i18n="pickDemo"></span></button>
        </div>
      </div>
      <div class="drop-overlay" aria-hidden="true">
        <strong data-i18n="dropTitle"></strong>
        <span data-i18n="dropBody"></span>
      </div>
      <div class="busy-line" aria-hidden="true"></div>
      <div class="rec-badge" role="status">
        <span class="dot"></span><span data-i18n="recording"></span> <span id="rec-time"></span>
        <button type="button" class="btn small" id="rec-stop"><span data-i18n="stopRec"></span></button>
      </div>

      <div class="tips" id="tips" hidden>
        <strong data-i18n="tipsTitle"></strong>
        <ul>
          <li data-i18n="tip1"></li>
          <li data-i18n="tip2"></li>
          <li data-i18n="tip3"></li>
          <li data-i18n="tip4"></li>
        </ul>
        <button type="button" class="btn small" id="tips-close"><span data-i18n="gotIt"></span></button>
      </div>

      <div class="bottom">
        <div class="timeline" id="timeline" hidden>
          <button type="button" class="btn icon quiet" id="btn-play">❚❚</button>
          <input type="range" id="time" min="0" max="1" step="0.01" value="0" aria-label="Timeline">
          <span class="num muted" id="time-label">0.0 / 0.0</span>
        </div>
        <nav class="dock" aria-label="Source">
          <button type="button" class="btn quiet" id="btn-open" data-i18n-title="openHint">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h4l1.5 1.5H14v7H2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
            <span data-i18n="open"></span>
          </button>
          <button type="button" class="btn quiet" id="btn-webcam">
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="4" width="9" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 7l4-2v6l-4-2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
            <span data-i18n="webcam"></span>
          </button>
          <button type="button" class="btn quiet" id="btn-text">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4h10M8 4v9M6 13h4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
            <span data-i18n="text"></span>
          </button>
          <button type="button" class="btn quiet" id="btn-demos">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2h5v5H2zM9 2h5v5H9zM2 9h5v5H2zM9 9h5v5H9z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
            <span data-i18n="demos"></span>
          </button>
          <span class="dock-sep" aria-hidden="true"></span>
          <button type="button" class="btn quiet" id="btn-random" data-i18n-title="kRandom">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h3l6 8h3M2 12h3l1.5-2M9.5 6L11 4h3M12.5 2.5L14 4l-1.5 1.5M12.5 10.5L14 12l-1.5 1.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
            <span data-i18n="randomLook"></span>
          </button>
        </nav>
      </div>
    </section>

    <aside class="panel" aria-label="Settings">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="panel-body" id="panel"></div>
    </aside>
  </main>

  <button type="button" class="focus-exit" id="focus-exit" data-i18n-title="exitFocus">×</button>
  <input type="file" id="file" accept="image/*,video/*" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button type="button" class="toast-action" id="toast-action" hidden></button></div>

  <dialog id="dlg-cmd" class="dialog cmd" aria-label="Search everything">
    <input type="text" id="cmd-input" autocomplete="off" spellcheck="false" aria-controls="cmd-list" aria-autocomplete="list">
    <ul id="cmd-list" role="listbox"></ul>
  </dialog>

  <dialog id="dlg-export" class="dialog wide">
    <header>
      <h2 data-i18n="exportTitle"></h2>
      <button type="button" class="btn icon" data-close data-i18n-title="close">×</button>
    </header>
    <div id="export-body"></div>
  </dialog>

  <dialog id="dlg-fonts" class="dialog wide">
    <header>
      <h2 data-i18n="fontsTitle"></h2>
      <button type="button" class="btn icon" data-close data-i18n-title="close">×</button>
    </header>
    <p class="muted" data-i18n="fontsBody"></p>
    <input type="text" id="font-search" class="font-search" spellcheck="false" autocomplete="off">
    <div class="font-grid" id="font-grid"></div>
  </dialog>

  <dialog id="dlg-demos" class="dialog wide">
    <header>
      <h2 data-i18n="demosTitle"></h2>
      <button type="button" class="btn icon" data-close data-i18n-title="close">×</button>
    </header>
    <p class="muted" data-i18n="demosBody"></p>
    <div class="demo-grid" id="demo-grid"></div>
  </dialog>

  <dialog id="dlg-about" class="dialog">
    <header>
      <h2 data-i18n="aboutTitle"></h2>
      <button type="button" class="btn icon" data-close data-i18n-title="close">×</button>
    </header>
    <p data-i18n="aboutBody"></p>
    <h3 data-i18n="shortcuts"></h3>
    <dl class="keys">
      <dt><kbd>Ctrl</kbd> <kbd>K</kbd></dt><dd data-i18n="kCommand"></dd>
      <dt><kbd>Ctrl</kbd> <kbd>O</kbd></dt><dd data-i18n="kOpen"></dd>
      <dt><kbd>Ctrl</kbd> <kbd>S</kbd></dt><dd data-i18n="kSave"></dd>
      <dt><kbd>E</kbd></dt><dd data-i18n="kExport"></dd>
      <dt><kbd>Ctrl</kbd> <kbd>Z</kbd> · <kbd>Ctrl</kbd> <kbd>Shift</kbd> <kbd>Z</kbd></dt><dd data-i18n="kUndo"></dd>
      <dt><kbd>C</kbd></dt><dd data-i18n="kCompare"></dd>
      <dt><kbd>R</kbd></dt><dd data-i18n="kRandom"></dd>
      <dt><kbd>H</kbd></dt><dd data-i18n="kFocus"></dd>
      <dt data-i18n="kPanKeys"></dt><dd data-i18n="kPan"></dd>
      <dt><kbd>Ctrl</kbd> <kbd>Shift</kbd> <kbd>C</kbd></dt><dd data-i18n="kCopy"></dd>
      <dt><kbd>F</kbd></dt><dd data-i18n="kFit"></dd>
      <dt><kbd>Space</kbd></dt><dd data-i18n="kPlay"></dd>
      <dt><kbd>D</kbd></dt><dd data-i18n="kDemos"></dd>
    </dl>
    <p class="muted small" data-i18n="aboutCredits"></p>
    <p><a id="repo-link" href="#" target="_blank" rel="noopener" data-i18n="source"></a> · MIT</p>
  </dialog>

  <script src="js/version.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/charsets.js"></script>
  <script src="js/palettes.js"></script>
  <script src="js/presets.js"></script>
  <script src="js/looks.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/sources.js"></script>
  <script src="js/exporter.js"></script>
  <script src="js/vendor/gifenc.js"></script>
  <script src="js/vendor/figlet.js"></script>
  <script src="js/banner.js"></script>
  <script src="js/gif.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/panel.js"></script>
  <script src="js/rail.js"></script>
  <script src="js/commands.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
